; =========================================================
; /etc/asterisk/pjsip.conf
; WORKING GENERATED CONFIG
; mediagtw / 10.1.2.112
; =========================================================

[global]
type=global
user_agent=INDEXUS-Asterisk
endpoint_identifier_order=username,ip,anonymous

; =========================================================
; TRANSPORTS
; =========================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
external_signaling_address=77.72.181.116
external_media_address=77.72.181.116

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
allow_reload=yes
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.9.0.0/16
local_net=10.1.2.0/24
;external_signaling_address=mediagtw.cordbloodcenter.com
;external_media_address=mediagtw.cordbloodcenter.com
external_signaling_address=77.72.181.116
external_media_address=77.72.181.116

; =========================================================
; LEGACY TRUNKS
; =========================================================


[trunk-sk-aor]
type=aor
contact=sip:10.9.33.2:5060
qualify_frequency=30

[trunk-sk-endpoint]
type=endpoint
transport=transport-udp
context=from-sk-trunk
disallow=all
allow=ulaw,alaw
aors=trunk-sk-aor
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=no
from_domain=10.9.33.2
media_address=10.1.2.112
ice_support=no

[trunk-sk-identify]
type=identify
endpoint=trunk-sk-endpoint
match=10.9.33.2

[trunk-ro-aor]
type=aor
contact=sip:10.33.0.55:5060
qualify_frequency=30

;[trunk-ro-endpoint]
;type=endpoint
;transport=transport-udp
;context=from-ro-trunk
;disallow=all
;allow=ulaw,alaw
;aors=trunk-ro-aor
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
;rewrite_contact=yes
;timers=no                   
;from_domain=10.33.0.55  
;rtp_keepalive=15       
;rtp_timeout=60 
;media_address=10.1.2.112

[trunk-ro-endpoint]
type=endpoint
transport=transport-udp
context=from-ro-trunk
disallow=all
allow=ulaw,alaw
aors=trunk-ro-aor
direct_media=no
rtp_symmetric=yes
ice_support=no
force_rport=yes
rewrite_contact=yes
timers=no
rtp_keepalive=15
rtp_timeout=60
media_address=10.1.2.112
from_user=mediagtw
from_domain=10.1.2.112
send_rpid=yes
send_pai=yes
trust_id_outbound=yes

[trunk-ro-identify]
type=identify
endpoint=trunk-ro-endpoint
match=10.33.0.55


