# REVIEW TEMPLATE ONLY. Include INSIDE the existing verified HTTPS server block
# on the AI server, never replace the site's complete nginx configuration.
# Gateway must listen on LOOPBACK ONLY. This file neither installs nor enables it.
location ^~ /gateway/ {
    allow 10.1.2.111/32;
    deny all;
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
}
# The trailing slash strips /gateway/ ONLY at the upstream boundary:
# public /gateway/health/ready -> loopback :8770/health/ready.
# Keep Bearer validation on ALL four endpoints in Gateway itself.
# Never include Authorization, tokens, or request/response bodies in access logs.
